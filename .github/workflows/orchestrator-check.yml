name: CSSBC orchestrator configuration check
on:
  push:
    paths:
      - '.github/workflows/orchestrator-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: End-to-end GitHub Chat smoke test
        shell: pwsh
        env:
          CSSBC_CHAT_ENDPOINT: ${{ secrets.CSSBC_CHAT_ENDPOINT }}
          CSSBC_CHAT_APP_PASSWORD: ${{ secrets.CSSBC_CHAT_APP_PASSWORD }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:CSSBC_CHAT_ENDPOINT)) {
            throw 'MISSING_SECRET: CSSBC_CHAT_ENDPOINT is empty.'
          }
          if ([string]::IsNullOrWhiteSpace($env:CSSBC_CHAT_APP_PASSWORD)) {
            throw 'MISSING_SECRET: CSSBC_CHAT_APP_PASSWORD is empty.'
          }

          $endpoint = $env:CSSBC_CHAT_ENDPOINT.Trim().Trim('"').Trim("'").Trim()
          if ($endpoint -notmatch '^[a-zA-Z][a-zA-Z0-9+.-]*://') { $endpoint = "https://$endpoint" }
          try { $uri = [Uri]$endpoint } catch { throw 'INVALID_ENDPOINT: Worker URL is malformed.' }
          if (-not $uri.IsAbsoluteUri -or $uri.Scheme -ne 'https' -or [string]::IsNullOrWhiteSpace($uri.Host)) {
            throw 'INVALID_ENDPOINT: Worker URL must use HTTPS.'
          }
          $endpoint = $uri.AbsoluteUri.TrimEnd('/')
          $headers = @{ Authorization = "Bearer $($env:CSSBC_CHAT_APP_PASSWORD)" }

          Write-Host '1/4 Checking authenticated agent status...'
          try {
            $agent = Invoke-RestMethod -Uri "$endpoint/api/agent/status" -Method Get -Headers $headers -TimeoutSec 30
          } catch {
            $code = if ($_.Exception.Response) { [int]$_.Exception.Response.StatusCode } else { 'network' }
            throw "AGENT_AUTH_OR_STATUS_FAILED: HTTP $code. Check Cloudflare APP_PASSWORD and AgentSession deployment."
          }
          Write-Host 'PASS: Worker accepted the chat password and the Durable Agent status route responded.'

          Write-Host '2/4 Sending a real message through the browser chat API...'
          $marker = "CSSBC_CHAT_E2E_$($env:GITHUB_RUN_ID)"
          $payload = @{ message = "Connection test. Reply with the exact marker $marker"; webSearch = $false; files = @() } | ConvertTo-Json -Depth 5
          try {
            $chat = Invoke-RestMethod -Uri "$endpoint/api/chat" -Method Post -Headers $headers -ContentType 'application/json; charset=utf-8' -Body ([Text.Encoding]::UTF8.GetBytes($payload)) -TimeoutSec 900
          } catch {
            $code = if ($_.Exception.Response) { [int]$_.Exception.Response.StatusCode } else { 'network/timeout' }
            $detail = $_.ErrorDetails.Message
            if ($detail) { $detail = $detail.Substring(0, [Math]::Min(300, $detail.Length)) }
            throw "CHAT_REQUEST_FAILED: HTTP $code. $detail"
          }
          if ([string]::IsNullOrWhiteSpace([string]$chat.reply) -or -not $chat.thread) {
            throw 'CHAT_EMPTY_REPLY: chat API did not return a thread and non-empty assistant reply.'
          }
          Write-Host "PASS: AI replied; conversation #$($chat.thread) was created."

          Write-Host '3/4 Verifying persisted user and assistant messages...'
          try {
            $history = Invoke-RestMethod -Uri "$endpoint/api/messages?thread=$([int]$chat.thread)" -Method Get -Headers $headers -TimeoutSec 60
          } catch {
            throw 'CHAT_HISTORY_READ_FAILED: the conversation was not readable after sending.'
          }
          $assistantMessages = @($history.messages | Where-Object { $_.role -eq 'assistant' -and -not [string]::IsNullOrWhiteSpace([string]$_.content) })
          $userMessages = @($history.messages | Where-Object { $_.role -eq 'user' -and $_.content -like "*$marker*" })
          if ($assistantMessages.Count -lt 1 -or $userMessages.Count -lt 1) {
            throw 'CHAT_HISTORY_INCOMPLETE: user prompt or assistant reply was not persisted.'
          }
          Write-Host 'PASS: both sides of the conversation were saved and can be reloaded.'

          Write-Host '4/4 Verifying conversation appears in the sidebar list...'
          $threads = Invoke-RestMethod -Uri "$endpoint/api/threads" -Method Get -Headers $headers -TimeoutSec 60
          if (-not (@($threads.threads | Where-Object { [int]$_.number -eq [int]$chat.thread }).Count)) {
            throw 'CHAT_THREAD_LIST_FAILED: newly created conversation is missing from the thread list.'
          }
          Write-Host 'PASS: conversation is listed. GitHub Chat end-to-end test succeeded.'
