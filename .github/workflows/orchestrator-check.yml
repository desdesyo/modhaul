name: CSSBC orchestrator configuration check
on:
  push:
    paths:
      - '.github/workflows/orchestrator-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - name: Validate GitHub secrets and Worker reachability
        shell: pwsh
        env:
          CSSBC_CHAT_ENDPOINT: ${{ secrets.CSSBC_CHAT_ENDPOINT }}
          CSSBC_CHAT_APP_PASSWORD: ${{ secrets.CSSBC_CHAT_APP_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:CSSBC_CHAT_ENDPOINT)) {
            throw 'MISSING_SECRET: CSSBC_CHAT_ENDPOINT is empty or unavailable to this workflow.'
          }
          if ([string]::IsNullOrWhiteSpace($env:CSSBC_CHAT_APP_PASSWORD)) {
            throw 'MISSING_SECRET: CSSBC_CHAT_APP_PASSWORD is empty or unavailable to this workflow.'
          }

          # Normalize common user input mistakes without exposing the secret value.
          $endpoint = $env:CSSBC_CHAT_ENDPOINT.Trim()
          $endpoint = $endpoint.Trim('"').Trim("'").Trim()

          if ([string]::IsNullOrWhiteSpace($endpoint)) {
            throw 'INVALID_ENDPOINT: CSSBC_CHAT_ENDPOINT is empty after trimming.'
          }

          # Accept a hostname pasted without a scheme; HTTPS is always enforced.
          if ($endpoint -notmatch '^[a-zA-Z][a-zA-Z0-9+.-]*://') {
            $endpoint = "https://$endpoint"
          }

          try {
            $uri = [Uri]$endpoint
          } catch {
            throw 'INVALID_ENDPOINT: CSSBC_CHAT_ENDPOINT is not a valid URL. Use https://your-worker.workers.dev'
          }
          if (-not $uri.IsAbsoluteUri -or $uri.Scheme -ne 'https' -or [string]::IsNullOrWhiteSpace($uri.Host)) {
            throw 'INVALID_ENDPOINT: endpoint must be a valid HTTPS URL, for example https://your-worker.workers.dev'
          }

          # Remove a trailing slash to keep the root probe canonical.
          $endpoint = $uri.AbsoluteUri.TrimEnd('/')
          $uri = [Uri]$endpoint
          Write-Host 'OK: endpoint normalized as HTTPS; configured value is not displayed.'
          if ($uri.AbsolutePath -ne '/' -and $uri.AbsolutePath -ne '') {
            Write-Host 'NOTE: endpoint contains a path; probing the exact configured URL.'
          }

          Write-Host 'OK: both GitHub secrets are present (values are not displayed).'
          Write-Host "Probing configured Worker origin: $($uri.GetLeftPart([UriPartial]::Authority))"

          try {
            $response = Invoke-WebRequest -Uri $endpoint -Method Get -TimeoutSec 25 -MaximumRedirection 5 -SkipHttpErrorCheck
            $status = [int]$response.StatusCode
          } catch {
            throw "WORKER_UNREACHABLE: HTTPS request failed: $($_.Exception.GetType().Name)"
          }

          Write-Host "Worker HTTP status: $status"
          if ($status -ge 500) {
            throw "WORKER_ERROR: Worker responded with HTTP $status."
          }

          if ($status -in @(401, 403)) {
            Write-Host 'REACHABLE: Worker is responding and appears to require authentication.'
            Write-Host 'AUTH_NOT_VERIFIED: the deployed Worker password cannot be compared from GitHub Actions without its documented auth request contract.'
          } elseif ($status -in @(404, 405)) {
            Write-Host 'REACHABLE: Worker host is responding; root route does not support this probe.'
            Write-Host 'AUTH_NOT_VERIFIED: endpoint route and password handshake need the Worker API contract.'
          } else {
            Write-Host 'REACHABLE: Worker returned a non-server-error HTTP response.'
            Write-Host 'AUTH_NOT_VERIFIED: this probe confirms secret presence and network reachability, not that the password matches the deployed Worker secret.'
          }
