name: Build CSSBC Recovery Utility
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/CSSBC-Recovery.ps1'
      - 'tools/BUILD_TRIGGER.txt'
      - '.github/workflows/build-recovery.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PS2EXE
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module ps2exe -Scope CurrentUser -Force
      - name: Build EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist | Out-Null
          Invoke-PS2EXE -InputFile tools/CSSBC-Recovery.ps1 -OutputFile dist/CSSBC_Recovery.exe -NoConsole -STA -Title 'CSS v34 Game Recovery' -Description 'Backup-first CSS v34 recovery utility' -Version '1.0.0.0'
          $exe = Join-Path $PWD 'dist/CSSBC_Recovery.exe'
          if (!(Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'EXE output was not created' }
          $item = Get-Item -LiteralPath $exe
          if ($item.Length -lt 1024) { throw "EXE output is unexpectedly small: $($item.Length) bytes" }
          $stream = [IO.File]::OpenRead($exe)
          try {
            $reader = [IO.BinaryReader]::new($stream)
            if ($reader.ReadUInt16() -ne 0x5A4D) { throw 'EXE is missing the MZ signature' }
            $stream.Position = 0x3C
            $peOffset = $reader.ReadInt32()
            if ($peOffset -lt 64 -or $peOffset -gt ($stream.Length - 6)) { throw 'EXE has an invalid PE header offset' }
            $stream.Position = $peOffset
            if ($reader.ReadUInt32() -ne 0x4550) { throw 'EXE is missing the PE signature' }
          } finally { $stream.Dispose() }
          Write-Host "Validated EXE: $($item.Length) bytes"
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: CSSBC_Recovery
          path: dist/CSSBC_Recovery.exe
          if-no-files-found: error
          retention-days: 30
