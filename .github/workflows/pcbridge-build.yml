name: PCBridge Windows build and tests
on:
  push:
    paths:
      - 'PCBridge/**'
      - '.github/workflows/pcbridge-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish guest agent
        run: dotnet publish PCBridge/guest-agent/PCBridge.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/PCBridge
      - name: Publish MCP stdio server
        run: dotnet publish PCBridge/mcp-server/PCBridge.Mcp.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/MCP
      - name: Build CSS Dev Controller
        run: dotnet publish PCBridge/controller/PCBridge.Controller.csproj -c Release -o artifacts/Controller
        run: |
          foreach ($dir in @('artifacts/PCBridge','artifacts/MCP','artifacts/Controller')) {
            $exe = Get-ChildItem $dir -Filter *.exe
            if (-not $exe) { throw "No EXE produced in $dir" }
            if ((Get-Item $exe.FullName).Length -lt 100KB) { throw "EXE unexpectedly small: $dir" }
            Write-Host "EXE: $($exe.FullName), $((Get-Item $exe.FullName).Length) bytes"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: PCBridge-win-x64
          path: artifacts/**
          if-no-files-found: error
          retention-days: 14
